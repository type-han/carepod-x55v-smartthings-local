# CAREPOD X55V local broker (LAN only)
# Copy to /etc/mosquitto/conf.d/carepod.conf
#
# The humidifier connects with username = deviceId (its MAC) and a password.
# No password_file is set, so the password is not checked.
# Anyone on the LAN can publish commands to this broker: keep it off guest networks.
listener 1883 0.0.0.0
allow_anonymous true
# logs "New client connected from <ip> as <deviceId>": the easiest way to find your deviceId
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
