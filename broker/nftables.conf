#!/usr/sbin/nft -f
# Runs ON THE BROKER host (e.g. /etc/nftables.conf, then: systemctl enable --now nftables).
# Packets addressed to the vendor cloud's tcp/1883 that reach this host (because the AP/router
# rewrote their destination MAC, see examples/proxmox-ap/redirect.nft) are handed to the local mosquitto.
# Replies go back with the cloud's IP as source (conntrack), so the humidifier does not notice.
#
# Replace before use:
#   <LAN_CIDR>   your LAN, e.g. 192.168.1.0/24
#   eth0         the broker's LAN interface
flush ruleset
table ip carepod {
  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
    iifname "eth0" ip saddr <LAN_CIDR> ip daddr != <LAN_CIDR> tcp dport 1883 counter redirect to :1883 comment "CAREPOD cloud MQTT -> local mosquitto"
  }
}
