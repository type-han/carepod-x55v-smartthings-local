name: carepod-x55v.v3
# v3 (2026-11-13): + deviceAlert (errors / warning) on main.
# v2 (2026-11-13): mist and target humidity are lists (mode), not sliders.
#   mist.step 0 and 4 froze the humidifier when sent directly, so they cannot be selected.
#   Categories only on main: categories on sub-components made the app add a timer per switch.
components:
  - id: main
    label: "가습기"
    capabilities:
      - id: switch
        version: 1
      - id: relativeHumidityMeasurement
        version: 1
      - id: temperatureMeasurement
        version: 1
      - id: fieldforgotten06843.waterLevel
        version: 1
      - id: fieldforgotten06843.deviceAlert
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Humidifier
  - id: mist
    label: "분무량"
    capabilities:
      - id: mode
        version: 1
  - id: humidityTarget
    label: "목표 습도"
    capabilities:
      - id: mode
        version: 1
  - id: heat
    label: "히터 기능"
    capabilities:
      - id: switch
        version: 1
  - id: sterilize
    label: "자동 살균 예약"
    capabilities:
      - id: switch
        version: 1
  - id: sleep
    label: "취침 모드"
    capabilities:
      - id: switch
        version: 1
  - id: childLock
    label: "차일드락"
    capabilities:
      - id: switch
        version: 1
preferences:
  - name: brokerIp
    title: "MQTT 브로커 IP"
    description: "가습기 MQTT를 받는 로컬 Mosquitto의 IP (예: 192.168.1.50)"
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: ""
  - name: brokerPort
    title: "MQTT 브로커 포트"
    required: true
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 65535
      default: 1883
  - name: deviceId
    title: "가습기 deviceId"
    description: "가습기 MAC 주소 (예: A0C6A5123456, 콜론 있어도 됨)"
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: ""
